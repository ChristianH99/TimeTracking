<svg xmlns="http://www.w3.org/2000/svg">
  <!-- The area icons, as one sprite: referenced as areas.svg#<name> from an
       <svg><use>, so a grid showing fifty icons costs one cached request.
       Each symbol is a 24×24 line drawing in currentColor, so an icon takes the
       colour of the text around it and needs no colour of its own. The names
       are the values of apps.roster.models.AreaIcon, and config/tests.py holds
       the two lists to each other. -->
  <symbol id="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
  </symbol>
  <symbol id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  </symbol>
  <symbol id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
  </symbol>
  <symbol id="tree" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 6 10h3l-4 7h14l-4-7h3z"/>
    <path d="M12 17v5"/>
  </symbol>
  <symbol id="plate" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="15" cy="12" r="7"/>
    <circle cx="15" cy="12" r="3.5"/>
    <path d="M3 4v5a1.5 1.5 0 0 0 3 0V4M4.5 10.5V20"/>
  </symbol>
  <symbol id="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21s-7.5-4.5-9.5-9.5A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 5.5C19.5 16.5 12 21 12 21z"/>
  </symbol>
  <symbol id="flower" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="9" r="2"/>
    <path d="M12 7a2.5 2.5 0 1 1 0-5 2.5 2.5 0 1 1 0 5M14 9a2.5 2.5 0 1 1 5 0 2.5 2.5 0 1 1-5 0M12 11a2.5 2.5 0 1 1 0 5 2.5 2.5 0 1 1 0-5M10 9a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0"/>
    <path d="M12 16v6M12 20c-1.5-2-3.5-2.5-5-2.5"/>
  </symbol>
  <symbol id="cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 19h10.5a4.5 4.5 0 0 0 .4-8.98A6.5 6.5 0 0 0 5.6 11.2 4 4 0 0 0 7 19z"/>
  </symbol>
  <symbol id="house" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11 12 3l9 8"/>
    <path d="M5 9.5V21h14V9.5M10 21v-6h4v6"/>
  </symbol>
  <symbol id="book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19V5a2 2 0 0 1 2-2h14v14H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h14v-4"/>
  </symbol>
  <symbol id="music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l11-2v13"/>
    <circle cx="6" cy="18" r="3"/>
    <circle cx="17" cy="16" r="3"/>
  </symbol>
  <symbol id="ball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18M3 12h18"/>
  </symbol>
  <symbol id="leaf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20C4 11 10 4 20 4c0 10-7 16-16 16z"/>
    <path d="M4 20 13 11"/>
  </symbol>
  <symbol id="fish" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12c3-5 9-7 14-3l5-4v14l-5-4c-5 4-11 2-14-3z"/>
    <path d="M8 11.5v.01"/>
  </symbol>
  <symbol id="apple" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 7.5c-1.5-1-5-1.5-6.5 1.5S5 16 7 19s3.5 2 5 1.5c1.5.5 3 1.5 5-1.5s3-7 1.5-10-5-2.5-6.5-1.5z"/>
    <path d="M12 7.5c0-2 1-4 3-4.5"/>
  </symbol>
  <symbol id="palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.6-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-4.1-4-7.3-9-7.3z"/>
    <path d="M7.5 11.5v.01M9.5 7.5v.01M14.5 7.5v.01M17 11v.01"/>
  </symbol>
</svg>
